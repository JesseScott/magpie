<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magpie</title>
  <meta name="description" content="Clip pages from Chrome on Android into an Obsidian vault.">
  <meta name="theme-color" content="#7c3aed">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Magpie</h1>
      <p id="dest" class="quiet"></p>
    </header>

    <p id="hint" class="hint" hidden>
      Nothing shared yet. In Chrome, open the menu, tap <strong>Share</strong>, then pick
      <strong>Magpie</strong>. You can also fill the form in by hand.
    </p>

    <form id="clip-form" autocomplete="off">
      <label for="title">Title</label>
      <input id="title" name="title" type="text" enterkeyhint="next">

      <label for="url">Link</label>
      <input id="url" name="url" type="url" inputmode="url" placeholder="https://">

      <label for="selection">Selected text</label>
      <textarea id="selection" name="selection" rows="4" placeholder="Optional"></textarea>

      <label for="tags">Extra tags <span class="quiet">(comma-separated)</span></label>
      <input id="tags" name="tags" type="text" placeholder="recipes, to-read" enterkeyhint="next">
      <p class="quiet small">Always tagged <code id="base-tag"></code>.</p>

      <label for="note">Note</label>
      <textarea id="note" name="note" rows="3" placeholder="Optional"></textarea>

      <button type="submit" id="save">Save to Obsidian</button>
      <button type="button" id="copy" class="secondary">Copy note as Markdown</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <footer class="quiet small">
      To install: Chrome menu, then <strong>Install app</strong> (or <strong>Add to Home screen</strong>).
    </footer>
  </main>

  <script src="clip.js"></script>
  <script src="app.js"></script>
</body>
</html>
